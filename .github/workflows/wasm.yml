name: Browser kernel

on:
  pull_request:
    paths: &wasm_paths
      - 'Makefile'
      - 'VERSION'
      - 'postgres'
      - 'third_party/pgvector'
      - 'buildsys/**'
      - 'compiler/**'
      - 'runtime/**'
      - 'embedded-c/**'
      - 'manifests/**'
      - 'extensions/pgvector/**'
      - 'wasm/**'
      - 'tests/wasm/**'
      - 'tests/embedded/**'
      - 'tests/runtime/**'
      - 'tests/buildsys/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'licenses/**'
      - 'examples/wasm/**'
      - '.github/workflows/wasm.yml'
      - '.github/workflows/upstream-canary.yml'
      - '.github/actions/wasm-setup/**'
  push:
    branches: [main, feature/wasm]
    paths: *wasm_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  PG_REPOSITORY: ${{ vars.PG_REPOSITORY }}
  PGVECTOR_REPOSITORY: ${{ vars.PGVECTOR_REPOSITORY }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.changes.outputs.native }}
      platform: ${{ steps.changes.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 buildsys/plan_wasm_ci.py --root . --base "$BASE_SHA"

  wasm:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/wasm-setup
        with:
          matrix: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
      - name: Validate the debug Chromium package
        if: github.event_name == 'pull_request'
        env:
          WASM_PLATFORM_CHECKS: ${{ needs.plan.outputs.platform }}
        run: make wasm-ci JOBS=2
      - name: Validate the optimized package and all browser engines
        if: github.event_name != 'pull_request'
        run: make wasm-release JOBS=2
      - name: Collect diagnostics
        if: always()
        run: python3 buildsys/collect_wasm_evidence.py --build-dir build --output build/wasm-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-${{ github.event_name == 'pull_request' && 'debug' || 'release' }}-${{ github.run_id }}
          path: build/wasm-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wasm-package-${{ github.run_id }}
          path: build/wasm/**/dist/*.tgz
          if-no-files-found: error
          retention-days: 14

  native:
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential clang flex libclang-dev \
            libicu-dev libipc-run-perl libreadline-dev libssl-dev llvm-dev zlib1g-dev
      - name: Shared runtime regression
        run: |
          make source-init
          make embedded-runtime-fast-check JOBS=2
          make copy-streaming-check runtime-events-check JOBS=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-shared-native-${{ github.run_id }}
          path: |
            build/embedded-kernel/reports/
            build/embedded-bootstrap/reports/
            build/reports/
          if-no-files-found: warn
          retention-days: 14

  candidate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: ./.github/actions/wasm-setup
        with:
          matrix: 'true'
      - name: Revalidate the preview's PostgreSQL 20 candidate
        # Keep this identity fixed; weekly canaries separately follow upstream.
        run: >-
          make wasm-upstream-canary
          PG_REF=7a0aa99e51c7a3263e6ee45f19f270ddae430a92
          PG_BRANCH=master CANARY_PROFILE=weekly WASM_MODE=release JOBS=2
      - name: Collect candidate diagnostics
        if: always()
        run: python3 buildsys/collect_wasm_evidence.py --build-dir build --output build/wasm-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-preview-pg20-${{ github.run_id }}
          path: build/wasm-evidence/
          if-no-files-found: error
          retention-days: 14
