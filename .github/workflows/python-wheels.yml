name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  PG_REPOSITORY: ${{ vars.PG_REPOSITORY }}
  PGVECTOR_REPOSITORY: ${{ vars.PGVECTOR_REPOSITORY }}
  MANYLINUX_POLICY: manylinux_2_28_x86_64
  SOURCE_DATE_EPOCH: "0"
  GNU_MAKE_VERSION: "4.4.1"
  GNU_MAKE_SHA256: dd16fb1d67bfab79a72f5e8390735c49e3e8e70b4945a15ab1f81ddb78658fb3

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      state: ${{ steps.identity.outputs.state }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Validate the canonical version and release tag
        id: identity
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          arguments=(--root . --github-output "$GITHUB_OUTPUT")
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=(--tag "$RELEASE_TAG")
          fi
          python3 buildsys/product_version.py "${arguments[@]}"
          mkdir -p build/reports
          python3 buildsys/check_python_release_workflow.py \
            --workflow .github/workflows/python-wheels.yml \
            --pypi-workflow .github/workflows/pypi.yml \
            --baseline=manifests/api/python-api-v1.json \
            --output build/reports/release-workflows.json

  kernel:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.05.07-2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install kernel build dependencies
        run: |
          dnf install -y \
            bison clang clang-devel curl flex llvm-devel make \
            perl pkgconf-pkg-config readline-devel strace tar zlib-devel
          make_archive="/tmp/make-${GNU_MAKE_VERSION}.tar.gz"
          make_source="/tmp/make-${GNU_MAKE_VERSION}"
          curl --fail --location --retry 3 \
            "https://ftp.gnu.org/gnu/make/make-${GNU_MAKE_VERSION}.tar.gz" \
            --output "$make_archive"
          echo "${GNU_MAKE_SHA256}  ${make_archive}" | sha256sum --check
          mkdir -p "$make_source"
          tar -xzf "$make_archive" --strip-components=1 --directory "$make_source"
          (
            cd "$make_source"
            ./configure --prefix=/opt/postgamma-tools
            /usr/bin/make -j2
            /usr/bin/make install
          )
          echo "/opt/postgamma-tools/bin" >> "$GITHUB_PATH"

      - name: Initialize pinned source dependencies
        run: make source-init PYTHON=/opt/python/cp314-cp314/bin/python

      - name: Validate packaging tools
        run: |
          /opt/python/cp314-cp314/bin/python -m unittest \
            tests.buildsys.test_product_version \
            tests.buildsys.test_prepare_release_assets \
            tests.buildsys.test_python_wheel -v
          /opt/python/cp314-cp314/bin/python buildsys/doctor.py \
            --root . --require-profile ast

      - name: Build and test the reusable static kernel
        run: |
          make static-sdk-package \
            BUILD_DIR="$GITHUB_WORKSPACE/build/release-kernel" \
            PYTHON=/opt/python/cp314-cp314/bin/python \
            PG_CONFIGURE_ARGS="--without-icu --disable-rpath" \
            CFLAGS="-O2 -fPIC" \
            JOBS=4

      - name: Pack the exact tested kernel closure
        run: |
          stage=build/python-manylinux-kernel
          kernel=build/release-kernel
          mkdir -p "$stage"
          cp "$kernel/embedded-kernel/lib/libpostgamma.a" \
            "$stage/libpostgamma_python_abi1.a"
          cp "$kernel/embedded-kernel/lib/postgamma-static-libs.txt" \
            "$stage/postgamma-static-libs.txt"
          cp "$kernel/embedded-kernel/reports/static-library-link.json" \
            "$stage/static-library-link.json"
          cp -a "$kernel/embedded-release/resource-pack" \
            "$stage/resource-pack"
          cp "$kernel/embedded-release/reports/resource-pack.json" \
            "$stage/resource-pack-evidence.json"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner \
            -czf build/python-manylinux-kernel.tar.gz \
            -C build python-manylinux-kernel

      - uses: actions/upload-artifact@v4
        with:
          name: python-manylinux-kernel
          path: build/python-manylinux-kernel.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: static-sdk-${{ needs.version.outputs.version }}
          path: |
            build/release-kernel/dist/postgamma-sdk-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz
            build/release-kernel/dist/postgamma-sdk-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz.sha256
            build/release-kernel/dist/postgamma-sdk-${{ needs.version.outputs.version }}-linux-x86_64.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  documentation:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install the pinned documentation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen python3-venv
          python3 -m venv build/docs-tools
          build/docs-tools/bin/python -m pip install \
            --requirement docs/requirements.txt

      - name: Build the public website in strict mode
        env:
          POSTGAMMA_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          make docs-check \
            MKDOCS="$PWD/build/docs-tools/bin/mkdocs" \
            DOXYGEN=doxygen

  wheels:
    needs:
      - version
      - kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.05.07-2
    strategy:
      fail-fast: false
      matrix:
        python_tag:
          - cp310
          - cp311
          - cp312
          - cp313
          - cp314
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: python-manylinux-kernel
          path: build

      - name: Restore the reusable kernel closure
        run: tar -xzf build/python-manylinux-kernel.tar.gz -C build

      - name: Build, repair, and clean-install the wheel
        env:
          PYTHON_TAG: ${{ matrix.python_tag }}
        run: |
          python_executable="/opt/python/${PYTHON_TAG}-${PYTHON_TAG}/bin/python"
          release_root="build/python-release/${PYTHON_TAG}"
          mkdir -p "$release_root/raw" "$release_root/reports"
          POSTGAMMA_STATIC_LIBRARY="build/python-manylinux-kernel/libpostgamma_python_abi1.a" \
          POSTGAMMA_STATIC_LINK_OPTIONS="build/python-manylinux-kernel/postgamma-static-libs.txt" \
          POSTGAMMA_STATIC_RECEIPT="build/python-manylinux-kernel/static-library-link.json" \
          POSTGAMMA_RESOURCE_ROOT="build/python-manylinux-kernel/resource-pack" \
            "$python_executable" python/build_backend.py \
              --wheel-dir "$release_root/raw" \
              --receipt "$release_root/reports/raw-wheel.json"
          "$python_executable" buildsys/repair_python_wheel.py \
            --wheel-dir "$release_root/raw" \
            --receipt "$release_root/reports/raw-wheel.json" \
            --output-dir "$release_root/wheel" \
            --output-receipt "$release_root/reports/repaired-wheel.json" \
            --output-report "$release_root/reports/manylinux-repair.json" \
            --platform "$MANYLINUX_POLICY"
          "$python_executable" buildsys/check_python_wheel.py \
            --wheel-dir "$release_root/wheel" \
            --receipt "$release_root/reports/repaired-wheel.json" \
            --baseline manifests/api/python-api-v1.json \
            --tests tests/python \
            --integration tests/python/integration_driver.py \
            --project-root "$GITHUB_WORKSPACE" \
            --work-root "$release_root/check" \
            --forbidden-prefix "$GITHUB_WORKSPACE" \
            --installer pip \
            --require-platform "$MANYLINUX_POLICY" \
            --output "$release_root/reports/python-wheel.json"

      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.python_tag }}
          path: |
            build/python-release/${{ matrix.python_tag }}/wheel/
            build/python-release/${{ matrix.python_tag }}/reports/
          if-no-files-found: error
          retention-days: 30

  release-gate:
    needs:
      - version
      - kernel
      - documentation
      - wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: build/python-release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: static-sdk-${{ needs.version.outputs.version }}
          path: build/static-release

      - name: Close the complete CPython release matrix
        run: |
          python3 buildsys/check_python_release.py \
            --artifacts-root build/python-release-artifacts \
            --baseline manifests/api/python-api-v1.json \
            --python-tag cp310 \
            --python-tag cp311 \
            --python-tag cp312 \
            --python-tag cp313 \
            --python-tag cp314 \
            --platform "$MANYLINUX_POLICY" \
            --output build/python-release-evidence.json

      - name: Promote exact tested bytes into the release bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 buildsys/prepare_release_assets.py prepare \
            --root . \
            --python-artifacts build/python-release-artifacts \
            --python-evidence build/python-release-evidence.json \
            --static-archive "build/static-release/postgamma-sdk-${VERSION}-linux-x86_64.tar.gz" \
            --static-checksum "build/static-release/postgamma-sdk-${VERSION}-linux-x86_64.tar.gz.sha256" \
            --static-receipt "build/static-release/postgamma-sdk-${VERSION}-linux-x86_64.json" \
            --output build/release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: postgamma-release-${{ needs.version.outputs.version }}
          path: build/release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  stage-github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - version
      - release-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: postgamma-release-${{ needs.version.outputs.version }}
          path: build/release-assets

      - name: Create the draft and upload the tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          flags=(--verify-tag --draft --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "postgamma $RELEASE_VERSION" \
            "${flags[@]}" \
            build/release-assets/*

  publish-github-release:
    needs:
      - version
      - stage-github-release
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Publish the approved immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          is_draft=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [[ "$is_draft" != "true" ]]; then
            echo "release is missing or is not a draft: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false
