name: Product documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen python3-venv
          python3 -m venv build/docs-tools
          build/docs-tools/bin/python -m pip install \
            --requirement docs/requirements.txt

      - name: Build the fail-closed static site
        env:
          POSTGAMMA_RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases
        run: |
          make docs-check \
            MKDOCS="$PWD/build/docs-tools/bin/mkdocs" \
            DOXYGEN=doxygen

      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
