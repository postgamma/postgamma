<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title"><title id="title">Session state belongs to its logical owner</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79949d"/></marker></defs><rect width="1000" height="540" fill="#101b22"/><g font-family="Arial,sans-serif"><rect x="40" y="40" width="430" height="150" rx="12" fill="#172b35" stroke="#8ba4ff" stroke-width="2"/><text x="60" y="75" font-size="22" font-weight="600" fill="#8ba4ff">Logical session A</text><text x="60" y="110" font-size="17" fill="#d4e3e7">TimeZone = Asia/Tokyo</text><text x="60" y="137" font-size="17" fill="#d4e3e7">State survives pauses in execution</text><rect x="530" y="40" width="430" height="150" rx="12" fill="#172b35" stroke="#f3ad74" stroke-width="2"/><text x="550" y="75" font-size="22" font-weight="600" fill="#f3ad74">Logical session B</text><text x="550" y="110" font-size="17" fill="#d4e3e7">TimeZone = America/New_York</text><text x="550" y="137" font-size="17" fill="#d4e3e7">State survives pauses in execution</text><path d="M255 190V250H400V280" fill="none" stroke="#79949d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 190V250H600V280" fill="none" stroke="#79949d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="220" y="280" width="560" height="100" rx="12" fill="#172b35" stroke="#65d8bc" stroke-width="2"/><text x="240" y="315" font-size="22" font-weight="600" fill="#65d8bc">Execution carrier</text><text x="240" y="350" font-size="17" fill="#d4e3e7">Activate the selected logical context before work</text><path d="M500 380V425" fill="none" stroke="#79949d" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="220" y="430" width="560" height="80" rx="12" fill="#172b35" stroke="#65d8bc" stroke-width="2"/><text x="240" y="465" font-size="22" font-weight="600" fill="#65d8bc">Same database 