site_name: postgamma
site_description: PostgreSQL inside your application
site_url: https://postgamma.com/
site_author: Shujie Zhang
docs_dir: docs
site_dir: build/docs/site
strict: true
exclude_docs: |
  Doxyfile
  requirements.txt
  reference/*.json
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/images/postgamma-mark.svg
  favicon: assets/images/postgamma-favicon-optical.svg
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - python/src
          options:
            docstring_style: google
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_bases: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

hooks:
  - buildsys/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/home.js

nav:
  - Home: index.md
  - Download: downloads.md
  - Start here:
      - Python quickstart: getting-started/index.md
      - When to use PostGamma: getting-started/why-postgamma.md
      - Static C quickstart: getting-started/c-static.md
      - Installation: getting-started/installation.md
      - Database paths and creation: getting-started/database-paths.md
  - Python guides:
      - Overview: python/index.md
      - Database and DB-API: python/database-and-dbapi.md
      - Asyncio: python/asyncio.md
      - Streaming and COPY: python/streaming-and-copy.md
      - Management and backup: python/management.md
      - Events, codecs, and Arrow: python/integration.md
      - Type mapping: python/types.md
  - C SDK:
      - Overview: c/index.md
      - Build and link: c/build-and-link.md
      - Ownership and concurrency: c/ownership-and-concurrency.md
      - Asynchronous execution: c/async.md
      - Streaming and COPY: c/streaming-and-copy.md
      - Management and backup: c/management.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Connections and concurrency: concepts/concurrency.md
      - Transactions: concepts/transactions.md
      - Durability and recovery: concepts/durability.md
      - Resource footprint: concepts/resource-footprint.md
      - Security model: concepts/security.md
  - Extensions:
      - Vector search with pgvector: extensions/pgvector.md
      - Bundled extension SDK: extensions/index.md
  - Reference:
      - Python API: python/reference.md
      - C API: c/reference.md
      - Extension SDK: extensions/reference.md
      - Status and errors: reference/errors.md
  - Compatibility:
      - Platforms and glibc: compatibility/platforms.md
      - PostgreSQL compatibility: compatibility/postgresql.md
      - Limits and unsupported features: compatibility/limits.md
  - Troubleshooting: troubleshooting.md
  - Release notes:
      - Release index: releases/index.md
      - Versioning policy: releases/versioning.md
      - 0.1.0a1: releases/0.1.0a1.md
  - About:
      - License: about/license.md

copyright: Copyright &copy; 2026 Shujie Zhang

extra:
  generator: false
